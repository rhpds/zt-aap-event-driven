# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "zt-aap-event-driven"
  owner_email: "nmartins@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "zero_touch"
  intake_type: "new"
  automation_type: "ansible"
  description: "New to Event-Driven Ansible? Start with the core model—sources, conditions, and actions—then take it further than \"alert runs a job.\" In this Zero-Touch lab on Ansible Automation Platform 2.6, you create one rulebook and harden it step by step: run it as an activation, secure intake with Event Streams, add environment and severity guardrails plus throttling, then remediate, verify, and escalate when verification fails—using Rule Audit to explain every decision. Events are Alertmanager-style HTTP alerts via a lab injector."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-2239"
  workflow_id: "f23b8332-c793-4d7d-9314-0a89bdc95409"

spec:
  title: "Event-Driven Ansible: From Event to Verified Outcome"
  learning_objectives:
    - "Create a rulebook that defines a source, condition, and action for an alert-shaped event"
    - "Configure a rulebook activation on Ansible Automation Platform 2.6 so the rulebook listens continuously"
    - "Monitor matching events and actions in Rule Audit"
    - "Secure inbound events with Event Streams and verify that invalid credentials are rejected"
    - "Implement environment and severity conditions that skip noisy or out-of-scope alerts"
    - "Configure throttling so alert storms do not create uncontrolled job runs"
    - "Automate a remediate-then-verify response path from a matching alert"
    - "Verify that a failed verification triggers an escalation action"
    - "Analyze Rule Audit entries to explain skip, remediate, and escalate decisions"
  modules:
    - id: module-01
      title: "What EDA is (and isn't)"
      duration_min: 25
      status: not_started
    - id: module-02
      title: "Your first rulebook activation"
      duration_min: 30
      status: not_started
    - id: module-03
      title: "Event Streams: safe intake"
      duration_min: 30
      status: not_started
    - id: module-04
      title: "Guardrails: when not to act"
      duration_min: 30
      status: not_started
    - id: module-05
      title: "Verified outcome"
      duration_min: 40
      status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | azure | aro | rosa | google | gcp — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: "2.6"                 # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 3.5
  audience: "beginner"               # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: true
    assessment_strategy: "Zero-Touch solve/validate against activation state, job counts under throttle, remediate/verify/escalate outcomes, and Rule Audit trails for skip vs act paths."
    catalog_gap: ""
    design_overview: "Introductory Zero-Touch EDA lab on AAP 2.6 where learners create one rulebook and harden it through Event Streams, guardrails, throttling, and closed-loop verify/escalate, using Alertmanager-style alerts and Rule Audit as evidence."
    module_summaries:
      - title: "What EDA is (and isn't)"
        overview: "Build a first rulebook (source, condition, action) against an alert-shaped webhook and contrast event-driven action with running the same Job Template manually."
      - title: "Your first rulebook activation"
        overview: "Deploy the rulebook as an AAP 2.6 activation, keep it listening, and find matches in Rule Audit."
      - title: "Event Streams: safe intake"
        overview: "Move intake to Event Streams; prove bad tokens fail and valid tokens still match the same rulebook."
      - title: "Guardrails: when not to act"
        overview: "Add environment/severity conditions and throttling; inject noise and storms; confirm skips and capped job counts."
      - title: "Verified outcome"
        overview: "Extend the rulebook for remediate → verify → escalate, then explain skip/remediate/escalate decisions in Rule Audit."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
