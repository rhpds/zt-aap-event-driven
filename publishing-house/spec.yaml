# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "zt-aap-event-driven"
  owner_email: "nmartins@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "zero_touch"
  intake_type: "new"
  automation_type: "ansible"
  description: "New to Event-Driven Ansible? In this ~2 hour Zero-Touch lab on Ansible Automation Platform 2.6, you create one rulebook and harden it: activation, Event Streams, and environment/severity guardrails—then remediate and verify a real cloud misconfiguration against Floci (AWS emulator). Pick one track—S3 public exposure, open security group, or runaway instance—and follow that path end to end while instructions for all three are available. Rule Audit shows why the platform skipped or acted."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-2239"
  workflow_id: "f23b8332-c793-4d7d-9314-0a89bdc95409"

spec:
  title: "Event-Driven Ansible: From Event to Verified Outcome"
  learning_objectives:
    - "Create a rulebook that defines a source, condition, and action for an alert-shaped event"
    - "Configure a rulebook activation on Ansible Automation Platform 2.6 so the rulebook listens continuously"
    - "Monitor matching events and actions in Rule Audit"
    - "Secure inbound events with Event Streams and verify that invalid credentials are rejected"
    - "Implement environment and severity conditions that skip noisy or out-of-scope alerts"
    - "Automate a remediate-then-verify response against Floci for the chosen cloud misconfiguration track"
    - "Analyze Rule Audit entries to explain skip versus remediate decisions"
  modules:
    - id: module-01
      title: "Pick your track + first match and activation"
      duration_min: 35
      status: not_started
    - id: module-02
      title: "Event Streams: safe intake"
      duration_min: 25
      status: not_started
    - id: module-03
      title: "Guardrails: when not to act"
      duration_min: 25
      status: not_started
    - id: module-04
      title: "Verified outcome on your Floci track"
      duration_min: 35
      status: not_started
  environment:
    platform: "rhel-vms"               # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"            # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | azure | aro | rosa | google | gcp — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    # Sizing is author-editable — placeholder lab defaults below
    vms_per_student:
      - role: aap
        count: 1
        cpu: 8
        ram_gb: 32
        disk_gb: 100
        os: rhel-9
      - role: floci
        count: 1
        cpu: 4
        ram_gb: 16
        disk_gb: 50
        os: rhel-9

    # --- Common fields (both platforms) ---
    aap_version: "2.6"                 # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:
      - registry.redhat.io
      - quay.io
      - github.com
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "beginner"               # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: true
    assessment_strategy: "Zero-Touch solve/validate for the chosen track: activation match, Event Stream auth, env/severity skips, Floci remediate+verify, and Rule Audit literacy."
    catalog_gap: "Existing EDA labs cover rulebooks and remediation (httpd/network/Splunk CVE) but not a beginner AAP 2.6 path that combines Event Streams, env/severity guardrails, and choose-your-track Floci cloud remediate-verify (S3 BPA, open SG, runaway instance) with Rule Audit as the success criterion."
    design_overview: "Two-hour Zero-Touch intro to EDA on AAP 2.6: one evolving rulebook through Event Streams and guardrails, then choose-your-track Floci cloud remediation (S3, SG, or runaway instance) with verified outcome and Rule Audit."
    module_summaries:
      - title: "Pick your track + first match and activation"
        overview: "Choose S3, security group, or runaway-instance track; build first rulebook match and run it as an activation with Rule Audit."
      - title: "Event Streams: safe intake"
        overview: "Secure intake with Event Streams; prove bad tokens fail and valid tokens still match."
      - title: "Guardrails: when not to act"
        overview: "Add environment/severity conditions; inject noise for the chosen track; confirm skips."
      - title: "Verified outcome on your Floci track"
        overview: "Remediate and verify the chosen Floci misconfiguration; explain skip vs remediate in Rule Audit."
    rcars_overlap_pct: 69
    rcars_top_matches:
      - title: "Ansible Automation Platform Roadshow 03 - Operational Efficiency"
        ci_name: "zt-ansiblebu.zt-ans-bu-roadshow03.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-roadshow03.prod"
        relevance_score: 69
        why_it_fits: "Teaches core EDA skills in AAP including rulebook activations and event-triggered remediation, plus Rule Audit practice."
      - title: "Get started with Event-Driven Ansible and Ansible Rulebooks"
        ci_name: "zt-ansiblebu.zt-ans-bu-eda-ansible-rulebook.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-eda-ansible-rulebook.prod"
        relevance_score: 64
        why_it_fits: "Beginner intro to rulebook structure (source, condition, action) and automated remediation scenarios."
      - title: "Defend,Contain and Comply"
        ci_name: "zt-ansiblebu.zt-ans-defend-contain-comply.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-defend-contain-comply.prod"
        relevance_score: 56
        why_it_fits: "Includes rulebook writing, Token Event Stream, and rulebook activation for alert-driven containment."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
