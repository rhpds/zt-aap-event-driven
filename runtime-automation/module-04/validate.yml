---
- name: Module 4 Validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    track_file: "{{ lookup('env', 'HOME') }}/eda-lab/track"
    floci_endpoint: "{{ lookup('env', 'FLOCI_ENDPOINT') | default('http://127.0.0.1:4566', true) }}"
  tasks:
    - name: Read track
      ansible.builtin.slurp:
        src: "{{ track_file }}"
      register: track_raw
      failed_when: false

    - name: Parse track
      ansible.builtin.set_fact:
        track: "{{ (track_raw.content | b64decode | trim) if track_raw.content is defined else '' }}"

    - name: Track selected
      validation_check:
        check: "{{ track in ['s3', 'sg', 'ec2'] }}"
        pass_msg: "Validating Floci track {{ track }}"
        error_msg: "Missing ~/eda-lab/track"

    - name: Floci reachable
      ansible.builtin.uri:
        url: "{{ floci_endpoint }}/_localstack/health"
        status_code: [200, 404]
      register: health
      failed_when: false

    - name: Floci health check
      validation_check:
        check: "{{ health.status is defined and health.status in [200, 404] }}"
        pass_msg: "Floci endpoint reachable"
        error_msg: "Floci not reachable at {{ floci_endpoint }}"
