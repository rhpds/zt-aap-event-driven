---
- name: Module 3 Solve
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    student_materials: "{{ lookup('env', 'HOME') }}/eda-lab/materials"
    system_materials: /usr/local/share/eda-lab
  tasks:
    - name: Locate final example rulebook on disk
      ansible.builtin.stat:
        path: "{{ item }}"
      register: final_candidates
      loop:
        - "{{ student_materials }}/rulebooks/alert-response.final.example.yml"
        - "{{ system_materials }}/rulebooks/alert-response.final.example.yml"

    - name: Pick first existing final example rulebook
      ansible.builtin.set_fact:
        final_rulebook: "{{ (final_candidates.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('') }}"

    - name: Require final example rulebook from exercise materials
      ansible.builtin.assert:
        that:
          - final_rulebook | length > 0
        fail_msg: >-
          Missing alert-response.final.example.yml under {{ student_materials }}
          or {{ system_materials }}. Re-run setup so control clones
          ansible-tmm/event-driven-aap-workshop.

    - name: Install example final rulebook (all tracks)
      ansible.builtin.copy:
        src: "{{ final_rulebook }}"
        dest: "{{ lookup('env', 'HOME') }}/eda-lab/rulebooks/alert-response.yml"
        mode: "0644"
        remote_src: true
