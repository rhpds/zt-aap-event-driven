---
# SETUP — Environment Setup (Zero-Touch)
# Project Zero runs this file: setup-automation/main.yml
# The platform runner is unprivileged and ephemeral. It must SSH into the
# student control VM and install materials there (not into the runner $HOME).
#
# Exercise materials come from ansible-tmm/event-driven-aap-workshop (cloned
# onto control). That GitHub repo must be publicly cloneable so both this
# setup and the Gitea migrate in config/instances.yaml succeed without tokens.

- name: Build inventory for control
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add control host
      ansible.builtin.add_host:
        name: control
        ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') | default('control', true) }}"
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') | default('22', true) }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_become_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        ansible_python_interpreter: /usr/libexec/platform-python

- name: Install lab materials on control
  hosts: control
  gather_facts: false
  become: true
  vars:
    eda_lab_root: /usr/local/share/eda-lab
    student_user: rhel
    student_eda_lab: "/home/{{ student_user }}/eda-lab"
    exercise_repo_url: https://github.com/ansible-tmm/event-driven-aap-workshop.git
    exercise_repo_version: main
    exercise_clone_dir: /var/tmp/event-driven-aap-workshop
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Ensure git is installed for exercise clone
      ansible.builtin.package:
        name: git
        state: present

    - name: Clone exercise materials onto control
      ansible.builtin.git:
        repo: "{{ exercise_repo_url }}"
        dest: "{{ exercise_clone_dir }}"
        version: "{{ exercise_repo_version }}"
        force: true

    - name: Fail early if exercise clone is incomplete
      ansible.builtin.stat:
        path: "{{ item }}"
      register: exercise_required
      loop:
        - "{{ exercise_clone_dir }}/rulebooks/alert-response.starter.yml"
        - "{{ exercise_clone_dir }}/bin/inject-alert.sh"
        - "{{ exercise_clone_dir }}/playbooks/reset_track.yml"

    - name: Assert exercise materials exist in clone
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          Exercise clone at {{ exercise_clone_dir }} is missing {{ item.item }}.
          Confirm {{ exercise_repo_url }} is publicly cloneable (Gitea migrate
          needs the same).
      loop: "{{ exercise_required.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Ensure system lab directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ eda_lab_root }}/rulebooks"
        - "{{ eda_lab_root }}/bin"
        - "{{ eda_lab_root }}/playbooks"
        - "{{ eda_lab_root }}/roles"

    - name: Ensure student lab directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ student_user }}"
        group: "{{ student_user }}"
        mode: "0755"
      loop:
        - "{{ student_eda_lab }}/rulebooks"
        - "{{ student_eda_lab }}/bin"
        - "{{ student_eda_lab }}/materials"

    - name: Sync exercise materials into the system share
      ansible.builtin.copy:
        src: "{{ exercise_clone_dir }}/{{ item }}/"
        dest: "{{ eda_lab_root }}/{{ item }}/"
        remote_src: true
        mode: preserve
      loop:
        - rulebooks
        - playbooks
        - bin
        - roles

    - name: Sync exercise materials into the student home
      ansible.builtin.copy:
        src: "{{ exercise_clone_dir }}/{{ item }}/"
        dest: "{{ student_eda_lab }}/materials/{{ item }}/"
        remote_src: true
        owner: "{{ student_user }}"
        group: "{{ student_user }}"
        mode: preserve
      loop:
        - rulebooks
        - playbooks
        - bin
        - roles

    - name: Install system injector scripts as executable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ eda_lab_root }}/bin/inject-alert.sh"
        - "{{ eda_lab_root }}/bin/reset-track.sh"

    - name: Install student injector scripts as executable
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ student_user }}"
        group: "{{ student_user }}"
        mode: "0755"
      loop:
        - "{{ student_eda_lab }}/materials/bin/inject-alert.sh"
        - "{{ student_eda_lab }}/materials/bin/reset-track.sh"

    - name: Link injector into student bin
      ansible.builtin.file:
        src: "{{ student_eda_lab }}/materials/bin/inject-alert.sh"
        dest: "{{ student_eda_lab }}/bin/inject-alert.sh"
        state: link
        force: true
        owner: "{{ student_user }}"
        group: "{{ student_user }}"

    - name: Link reset script into student bin
      ansible.builtin.file:
        src: "{{ student_eda_lab }}/materials/bin/reset-track.sh"
        dest: "{{ student_eda_lab }}/bin/reset-track.sh"
        state: link
        force: true
        owner: "{{ student_user }}"
        group: "{{ student_user }}"

    - name: Verify installed starter and scripts on control
      ansible.builtin.stat:
        path: "{{ item }}"
      register: installed_files
      loop:
        - "{{ eda_lab_root }}/rulebooks/alert-response.starter.yml"
        - "{{ eda_lab_root }}/bin/inject-alert.sh"
        - "{{ eda_lab_root }}/playbooks/reset_track.yml"
        - "{{ student_eda_lab }}/materials/rulebooks/alert-response.starter.yml"
        - "{{ student_eda_lab }}/bin/inject-alert.sh"
        - "{{ student_eda_lab }}/materials/playbooks/reset_track.yml"

    - name: Fail if any required student file is missing after install
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Setup did not install {{ item.item }} on control"
      loop: "{{ installed_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Setup summary
      ansible.builtin.debug:
        msg: >-
          Lab materials cloned from {{ exercise_repo_url }} (@{{ exercise_repo_version }})
          onto control under {{ eda_lab_root }} and {{ student_eda_lab }}/materials/.
          Starter: {{ eda_lab_root }}/rulebooks/alert-response.starter.yml
          (also {{ student_eda_lab }}/materials/rulebooks/alert-response.starter.yml).
          Floci API route is https://floci-{{ lookup('env', 'GUID') }}.{{ lookup('env', 'DOMAIN') }}/.
          Floci UI route is https://floci-ui-{{ lookup('env', 'GUID') }}.{{ lookup('env', 'DOMAIN') }}/.
