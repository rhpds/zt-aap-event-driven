---
- name: Verify runaway instance stopped on Floci
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    floci_endpoint: "{{ lookup('env', 'FLOCI_ENDPOINT') | default('http://127.0.0.1:4566', true) }}"
    instance_name: "eda-lab-runaway"
  tasks:
    - name: Describe instance
      amazon.aws.ec2_instance_info:
        region: us-east-1
        access_key: test
        secret_key: test
        endpoint_url: "{{ floci_endpoint }}"
        filters:
          "tag:Name": "{{ instance_name }}"
      register: found
      failed_when: false

    - name: Report state
      ansible.builtin.debug:
        msg: "Instances={{ found.instances | default([]) }}"
