---
- name: Quarantine open security group on Floci
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    floci_endpoint: "{{ lookup('env', 'FLOCI_ENDPOINT') | default('http://127.0.0.1:4566', true) }}"
    sg_name: "eda-lab-open"
  tasks:
    - name: Replace wide-open rules with deny-all posture
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        description: "Quarantined by EDA lab"
        region: us-east-1
        access_key: test
        secret_key: test
        endpoint_url: "{{ floci_endpoint }}"
        rules: []
        rules_egress:
          - proto: -1
            cidr_ip: "0.0.0.0/0"
      failed_when: false
