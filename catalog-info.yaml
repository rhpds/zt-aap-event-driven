metadata:
  name: zt-aap-event-driven
  title: zt-aap-event-driven
  description: 'New to Event-Driven Ansible? Start with the core model—sources, conditions,
    and actions—then take it further than "alert runs a job." In this Zero-Touch lab
    on Ansible Automation Platform 2.6, you create one rulebook and harden it step
    by step: run it as an activation, secure intake with Event Streams, add environment
    and severity guardrails plus throttling, then remediate, verify, and escalate when
    verification fails—using Rule Audit to explain every decision. Events are Alertmanager-style
    HTTP alerts via a lab injector.'
