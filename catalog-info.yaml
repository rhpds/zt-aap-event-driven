metadata:
  name: zt-aap-event-driven
  title: zt-aap-event-driven
  description: 'New to Event-Driven Ansible? In this ~2 hour Zero-Touch lab on Ansible
    Automation Platform 2.6, you create one rulebook and harden it: activation, Event
    Streams, and environment/severity guardrails—then remediate and verify a cloud
    misconfiguration against Floci (AWS emulator). Pick one track—S3 public exposure,
    open security group, or runaway instance—and follow that path end to end. Rule
    Audit shows why the platform skipped or acted.'
