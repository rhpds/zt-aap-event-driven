apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: zt-aap-event-driven
  title: zt-aap-event-driven
  description: "Automation answers \"what should happen?\" but something still has
    to say when. In this hands-on workshop, you'll learn how Event-Driven
    Ansible turns that question into code. Using rulebooks, you'll codify your
    response to real-world events so your infrastructure responds in seconds,
    without waiting for a human to notice.  You'll start at the command line,
    building your first rulebook around a webhook source, the simplest way to
    understand how sources, conditions, and actions work together. From there,
    you'll bring that rulebook into Ansible Automation Platform 2.6, where
    rulebook activations run continuously, restart on failure, and record every
    matching event in the Rule Audit. You'll secure inbound events with Event
    Streams, then put the platform to work against sources your enterprise
    already uses: Splunk alerts driving automated response, Kafka event streams
    fanning out to multiple listeners, and Prometheus metrics triggering
    targeted remediation."
